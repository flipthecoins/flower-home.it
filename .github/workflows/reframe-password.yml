name: Reframe password rotation
run-name: Reframe password rotation ${{ inputs.operation_id }}

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Unique rotation ID from the Reframe VPS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reframe-admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Replace password and revoke existing panel sessions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PASSWORD: ${{ secrets.REFRAME_ADMIN_NEXT_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          account = '485282ffb1d94304113b9aed82ccaa16'
          namespace = 'a69bb28406af489f9d249f225c8f4e19'
          password = os.environ['NEXT_PASSWORD']
          if len(password) < 32:
              raise SystemExit('Missing or invalid rotation secret')
          base = 'https://api.cloudflare.com/client/v4/accounts/' + account

          def cf(path, method='GET', data=None):
              headers = {'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'],
                         'Content-Type': 'application/json', 'User-Agent': 'ReframeAdmin-rotation'}
              for attempt in range(4):
                  request = urllib.request.Request(base + path, method=method, headers=headers,
                      data=None if data is None else json.dumps(data).encode())
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          result = json.load(response)
                      if not result.get('success'):
                          raise SystemExit('Cloudflare did not confirm the operation')
                      return result
                  except urllib.error.HTTPError as error:
                      if error.code not in (429, 500, 502, 503, 504) or attempt == 3:
                          raise SystemExit('Cloudflare HTTP ' + str(error.code)) from None
                  except (TimeoutError, urllib.error.URLError):
                      if attempt == 3:
                          raise SystemExit('Cloudflare connection failed') from None
                  time.sleep(2 ** (attempt + 1))

          cf('/workers/scripts/admin/secrets', 'PUT',
             {'name': 'ADMIN_PASSWORD', 'text': password, 'type': 'secret_text'})
          print('Password replacement confirmed by Cloudflare')
          # Only authentication sessions; casino data and public integrations are untouched.
          keys, cursor = [], None
          while True:
              query = {'prefix': 'bot-session:', 'limit': 1000}
              if cursor:
                  query['cursor'] = cursor
              result = cf('/storage/kv/namespaces/' + namespace + '/keys?' + urllib.parse.urlencode(query))
              keys.extend(item['name'] for item in result['result'])
              cursor = result.get('result_info', {}).get('cursor')
              if not cursor:
                  break
          for start in range(0, len(keys), 1000):
              cf('/storage/kv/namespaces/' + namespace + '/bulk', 'DELETE', keys[start:start+1000])
          print('Previous panel sessions revoked:', len(keys))
          PY
