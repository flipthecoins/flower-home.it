name: Temporary Cloudflare traffic audit

on:
  push:
    branches: [codex/cf-traffic-audit-20261009]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Query existing traffic and logging settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 audit/cloudflare_traffic.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-traffic-audit
          path: audit-result.json
          retention-days: 1
