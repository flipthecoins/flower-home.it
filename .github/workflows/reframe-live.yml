name: Reframe live lists

on:
  push:
    branches: [main, codex/reframe-live-lists]
    paths: ['ops/reframe-admin/**', '.github/workflows/reframe-live.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reframe-admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/reframe-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/reframe-admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --config delivery/wrangler.toml
      - run: npx wrangler deploy --dry-run --config admin/wrangler.toml
      - name: Publish public lists
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config delivery/wrangler.toml
      - name: Publish admin (preserve existing credentials)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config admin/wrangler.toml --keep-vars
